[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-signal"
version = "0.1.0"
description = "Guardian marketplace review ingestion and voice-of-customer platform"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pytz>=2025.2",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "setuptools>=82",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
browser = [
  "selenium>=4.32,<5",
  "undetected-chromedriver>=3.5.5,<4",
]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
guardian-voc = "guardian_voc.cli:main"
guardian-signal = "guardian_voc.cli:main"

[tool.setuptools.packages.find]
include = ["guardian_voc*", "social_crawler*"]

[tool.setuptools.package-data]
guardian_voc = ["taxonomy/*.yaml", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
