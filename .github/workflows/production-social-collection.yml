name: Production social collection

on:
  workflow_dispatch:
    inputs:
      repair_discovery_cache:
        description: Back up the database and rebuild only the derived discovery cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    concurrency:
      group: guardian-signal-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '31.22.104.121.compute.verda.run' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/guardian-signal' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/guardian-deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          31.22.104.121.compute.verda.run ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGUh+ji+1lTytVTe1Kz+huGJLDgMQl29ZTcYhCoxbDd+
          31.22.104.121 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGUh+ji+1lTytVTe1Kz+huGJLDgMQl29ZTcYhCoxbDd+
          KNOWN_HOSTS
          fi
          chmod 600 ~/.ssh/guardian-deploy ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::DEPLOY_KNOWN_HOSTS does not contain a host key for $DEPLOY_HOST"
            exit 1
          }

      - name: Install protected SERP credential
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          test -n "$SERP_API_KEY"
          printf '%s\n' "$SERP_API_KEY" | ssh \
            -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; install -d -m 700 '${DEPLOY_PATH}/.runtime'; cat > '${DEPLOY_PATH}/.runtime/serp-api-key'; chmod 600 '${DEPLOY_PATH}/.runtime/serp-api-key'"

      - name: Enable all three sources and restart safely
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${DEPLOY_PATH}/scripts/configure-production-social' '${DEPLOY_PATH}/scripts/deploy-server' && '${DEPLOY_PATH}/scripts/configure-production-social' && '${DEPLOY_PATH}/scripts/deploy-server'"

      - name: Repair interrupted discovery cache with backup
        if: inputs.repair_discovery_cache
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}'; docker compose stop app; docker compose run --rm --no-deps --entrypoint python app scripts/repair-discovery-cache; repair_status=\$?; scripts/deploy-server; exit \${repair_status}"

      - name: Run bounded 365-day production collection
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && token=\$(cat .runtime/admin-token) && curl --fail --silent --show-error --max-time 21000 -H 'Content-Type: application/json' -H \"X-Admin-Token: \${token}\" --data '{\"source_ids\":[\"guardian_public_social\",\"hasaki_public_social\",\"watsons_public_social\"],\"pages_per_query\":3,\"fetch_limit\":500,\"extraction_limit\":500,\"lookback_days\":365,\"refresh\":true}' http://127.0.0.1:8000/api/v1/live-collections > .runtime/last-social-collection.json"

      - name: Report redacted server failure context
        if: failure()
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose logs --tail=240 app 2>&1 | grep -E 'Traceback|ERROR|Exception|Error|File \"|HTTP/1.1 5' | sed -E 's/[A-Za-z0-9_-]{32,}/[REDACTED]/g' | tail -100"

      - name: Verify terminal result without exposing data or credentials
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && python3 -c 'import json; p=json.load(open(\".runtime/last-social-collection.json\")); assert p[\"status\"] in {\"completed\", \"partial\"}, p[\"status\"]; s=(p.get(\"stage_results\") or {}).get(\"ingest\") or {}; c=s.get(\"collection\") or {}; out={k:p.get(k) for k in (\"pipeline_run_id\",\"status\",\"records_seen\",\"records_inserted\",\"records_skipped\",\"records_failed\")}; out.update({k:c.get(k) for k in (\"searches\",\"discovered\",\"fetch_attempted\",\"extraction_attempted\")}); print(json.dumps(out, sort_keys=True))' && curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/ready >/dev/null"
