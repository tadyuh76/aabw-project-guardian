name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install backend
        run: uv sync --frozen --extra dev

      - name: Verify production dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/requirements.lock
          diff --unified <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)

      - name: Test backend
        run: uv run pytest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test -- --run

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Validate Compose
        run: |
          mkdir -p .runtime
          touch .runtime/admin-token .runtime/openai-api-key .runtime/serp-api-key .runtime/tinyfish-api-key
          docker compose config --quiet

      - name: Build production image
        run: docker build --tag guardian-signal:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: guardian-signal-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /opt/guardian-signal
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/guardian-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/guardian-deploy ~/.ssh/known_hosts

      - name: Synchronize release
        run: |
          ssh_args="-i $HOME/.ssh/guardian-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.runtime/' \
            --exclude='data/' \
            --exclude='.venv/' \
            --exclude='web/node_modules/' \
            --exclude='web/dist/' \
            -e "ssh $ssh_args" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${DEPLOY_PATH}/scripts/deploy-server' && '${DEPLOY_PATH}/scripts/deploy-server'"
