name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Verify production dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/requirements.lock
          diff --unified <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Validate Compose
        run: |
          mkdir -p .runtime
          touch .runtime/admin-token .runtime/openai-api-key .runtime/serp-api-key .runtime/tinyfish-api-key
          docker compose config --quiet

      - name: Build production image
        run: docker build --tag guardian-signal:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: guardian-signal-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '31.22.104.121.compute.verda.run' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/guardian-signal' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/guardian-deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          31.22.104.121.compute.verda.run ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGUh+ji+1lTytVTe1Kz+huGJLDgMQl29ZTcYhCoxbDd+
          31.22.104.121 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGUh+ji+1lTytVTe1Kz+huGJLDgMQl29ZTcYhCoxbDd+
          KNOWN_HOSTS
          fi
          chmod 600 ~/.ssh/guardian-deploy ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::DEPLOY_KNOWN_HOSTS does not contain a host key for $DEPLOY_HOST"
            exit 1
          }

      - name: Install runner deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Bootstrap server runtime
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -se" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            sudo_cmd=""
          elif command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          else
            echo "Root or passwordless sudo is required to bootstrap deployment dependencies." >&2
            exit 1
          fi

          if ! command -v rsync >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "apt-get is required to bootstrap this Ubuntu deployment host." >&2
              exit 1
            fi
            export DEBIAN_FRONTEND=noninteractive
            ${sudo_cmd} apt-get update
            ${sudo_cmd} apt-get install -y ca-certificates curl rsync docker.io docker-compose-plugin
          fi

          if command -v systemctl >/dev/null 2>&1; then
            ${sudo_cmd} systemctl enable --now docker
          else
            ${sudo_cmd} service docker start || true
          fi

          ${sudo_cmd} install -d -m 755 "$DEPLOY_PATH"
          if [ "$(id -u)" -ne 0 ]; then
            ${sudo_cmd} chown "$(id -u):$(id -g)" "$DEPLOY_PATH"
            docker ps >/dev/null 2>&1 || {
              echo "Deploy user must be able to run docker without an interactive sudo prompt." >&2
              exit 1
            }
          fi
          REMOTE

      - name: Synchronize release
        run: |
          ssh_args="-i $HOME/.ssh/guardian-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.runtime/' \
            --exclude='data/' \
            --exclude='.venv/' \
            --exclude='web/node_modules/' \
            --exclude='web/dist/' \
            -e "ssh $ssh_args" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${DEPLOY_PATH}/scripts/deploy-server' && '${DEPLOY_PATH}/scripts/deploy-server'"
