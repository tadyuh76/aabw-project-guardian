name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Verify production dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/requirements.lock
          diff --unified <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Validate Compose
        run: |
          mkdir -p .runtime
          touch .runtime/admin-token .runtime/openai-api-key .runtime/serp-api-key .runtime/tinyfish-api-key
          docker compose config --quiet

      - name: Build production image
        run: docker build --tag guardian-signal:ci .
