name: Production data inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/guardian-signal' }}
    steps:
      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/guardian-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/guardian-deploy ~/.ssh/known_hosts

      - name: Print redacted aggregate collection counts
        run: |
          ssh -i ~/.ssh/guardian-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose stop app >/dev/null && docker compose run --rm --no-deps --entrypoint python app - <<'PY'
          import json
          from pathlib import Path
          from guardian_voc.config import get_settings
          from guardian_voc.db import Database

          settings = get_settings()
          db = Database(settings=settings, read_only=True)
          last = db.query_one(
              '''
              SELECT id, status, trigger, current_stage, started_at,
                     completed_at, stage_results, error_summary
              FROM pipeline_runs
              ORDER BY started_at DESC LIMIT 1
              '''
          )
          recent = db.query(
              '''
              SELECT id, status, trigger, current_stage, started_at,
                     completed_at, stage_results, error_summary
              FROM pipeline_runs
              ORDER BY started_at DESC LIMIT 8
              '''
          )
          stage_results = {}
          if last and last.get('stage_results'):
              stage_results = json.loads(str(last['stage_results']))
          ingest = stage_results.get('ingest') or {}
          collection = ingest.get('collection') or {}
          recent_runs = []
          for row in recent:
              row_stage_results = {}
              if row.get('stage_results'):
                  row_stage_results = json.loads(str(row['stage_results']))
              row_ingest = row_stage_results.get('ingest') or {}
              row_collection = row_ingest.get('collection') or {}
              recent_runs.append({
                  'id': row.get('id'),
                  'status': row.get('status'),
                  'trigger': row.get('trigger'),
                  'current_stage': row.get('current_stage'),
                  'started_at': row.get('started_at'),
                  'completed_at': row.get('completed_at'),
                  'error_summary': row.get('error_summary'),
                  'seen': row_ingest.get('seen'),
                  'inserted': row_ingest.get('inserted'),
                  'skipped': row_ingest.get('skipped'),
                  'failed': row_ingest.get('failed'),
                  'collection': row_collection,
              })
          fetch_status = db.query(
              '''
              SELECT status, count(*) AS count
              FROM fetch_attempts
              GROUP BY status
              ORDER BY status
              '''
          )
          extraction_status = db.query(
              '''
              SELECT status, count(*) AS count, sum(unit_count) AS units
              FROM page_extractions
              GROUP BY status
              ORDER BY status
              '''
          )
          latest_discovery = db.query(
              '''
              SELECT source_id, count(*) AS total,
                     sum(CASE WHEN eligible_for_fetch THEN 1 ELSE 0 END) AS eligible
              FROM discovery_results
              GROUP BY source_id
              ORDER BY source_id
              '''
          )
          feedback = db.query(
              '''
              SELECT source_group, source_platform, count(*) AS count
              FROM feedback_items
              WHERE source_group = 'social'
              GROUP BY source_group, source_platform
              ORDER BY source_platform
              '''
          )
          manifest_path = Path(settings.voc_data_dir) / 'live_data_manifest.json'
          manifest = {}
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest_stages = manifest.get('stages') or {}
          manifest_discover = manifest_stages.get('discover') or {}
          print(json.dumps({
              'last_run': {
                  **{
                      key: last.get(key)
                      for key in (
                          'id', 'status', 'trigger', 'current_stage',
                          'started_at', 'completed_at', 'error_summary'
                      )
                  },
                  **{
                      key: ingest.get(key)
                      for key in ('seen', 'inserted', 'skipped', 'failed')
                  },
              } if last else None,
              'collection': collection,
              'recent_runs': recent_runs,
              'fetch_status': fetch_status,
              'extraction_status': extraction_status,
              'discovery_by_source': latest_discovery,
              'social_feedback_by_platform': feedback,
              'manifest_discover': {
                  key: manifest_discover.get(key)
                  for key in (
                      'searches', 'available_before', 'available_after',
                      'events', 'unique_results', 'snapshot_results',
                      'eligible_for_fetch'
                  )
              },
              'manifest_discover_errors': manifest_discover.get('errors') or [],
          }, sort_keys=True, default=str))
          PY
          status=\$?
          scripts/deploy-server >/dev/null
          exit \${status}"
